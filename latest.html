<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d18">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AFTERWAKE — 最新版を開く</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080d18; color: #edf7ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 480px); padding: 32px; border: 1px solid rgba(120,243,250,.28); background: linear-gradient(145deg,#101c30,#080d18); box-shadow: 0 24px 80px #0008; }
    .eyebrow { color: #78f3fa; font: 11px ui-monospace,monospace; letter-spacing: .18em; }
    h1 { margin: 12px 0; font-size: clamp(28px,8vw,42px); }
    p { color: #aab8ce; line-height: 1.8; }
    button, a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; border: 1px solid #91f3f4; background: #78e5eb; color: #07151b; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { min-height: 1.6em; margin: 16px 0 0; font-size: 13px; }
    .back { min-height: auto; margin-top: 18px; padding: 0; border: 0; background: transparent; color: #9aabc2; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">AFTERWAKE / CACHE RESET</span>
    <h1>最新版を開く</h1>
    <p>このゲーム専用の古いキャッシュを整理して、現在公開されている画面を開きます。プレイ中のゲームは自動では再読み込みされません。</p>
    <button id="openLatest" type="button">キャッシュを整理して最新版を開く</button>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="back" href="./index.html">ゲームへ戻る</a>
  </main>
  <script>
    const button = document.getElementById('openLatest');
    const status = document.getElementById('status');

    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = 'このゲームのキャッシュを整理しています…';
      const projectPath = new URL('./', location.href).pathname;

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter((registration) => {
            const scope = new URL(registration.scope);
            return scope.origin === location.origin && scope.pathname === projectPath;
          }).map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('afterwake-')).map((key) => caches.delete(key)));
        }
      } catch {
        // Continue to the network-fresh page even when storage cleanup is unavailable.
      }

      const target = new URL('./index.html', location.href);
      target.searchParams.set('fresh', String(Date.now()));
      location.replace(target.href);
    });
  </script>
</body>
</html>
